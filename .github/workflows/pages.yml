name: Pages

# Manual until the released phasync/swerve contain every symbol the site documents
# (the build reflects Swerve\Claim and Swerve\OrderedChannel, newer than 0.1.0-alpha26).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pcntl, posix, sockets
      # phasync and swerve are require-dev: the reference is read from their source by reflection
      - run: composer install --no-interaction --prefer-dist
      - run: php build.php
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
